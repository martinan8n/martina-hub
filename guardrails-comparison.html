<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardrails</title><link rel="stylesheet" href="styles/guardrails-chatgpt-tokens.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-family),sans-serif;color:#242424;background:#fafafa}header{padding:22px 28px 18px;border-bottom:1px solid #e5e5e5;background:white}h1{font-size:22px;letter-spacing:-.5px;margin:0 0 16px}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;font-size:13px;padding:9px 16px;border:1px solid #e4e4e4;border-radius:8px;background:white;cursor:pointer}button[aria-pressed=true]{background:#242424;color:white;border-color:#242424}main{display:block;min-width:0}.column+ .column{border-left:1px solid #dedede}.label{height:86px;padding:18px 24px;background:white;border-bottom:1px solid #e5e5e5;display:flex;gap:12px;align-items:center}.letter{font-size:14px;font-weight:600;width:30px;height:30px;border:1px solid #ddd;border-radius:8px;display:grid;place-items:center}.label h2{font-size:15px;margin:0 0 5px}.label p{font-size:12px;color:#777;margin:0}.label a{margin-left:auto;font-size:12px;color:#555}iframe{border:0;width:100%;height:calc(100vh - 209px);min-height:600px;display:block}@media(max-width:900px){header{padding:16px}h1{font-size:19px}.label{padding:12px;gap:8px;height:100px}.label h2{font-size:13px}.label p{font-size:11px}.label a{display:none}.letter{flex-shrink:0}iframe{height:calc(100vh - 225px)}} </style></head><body><header><h1>Guardrails</h1><nav aria-label="Screen"><button data-screen="content" aria-pressed="true">Content check</button><button data-screen="workflow" aria-pressed="false">Workflow check</button><button data-screen="limit" aria-pressed="false">Rate limit</button><button data-screen="tool" aria-pressed="false">Tool settings</button><button data-screen="build" aria-pressed="false">Agent build</button><button data-screen="added" aria-pressed="false">Guardrails added</button></nav></header><main><section class="column"><div class="label"><div><h2>New design system</h2><p>Clearer hierarchy, styled options, more space.</p></div><a id="open-b" href="guardrails-option-b.html?screen=content#/gr-hifi" target="_blank">Open ↗</a></div><iframe title="Option B — new design system" src="guardrails-option-b.html?screen=content#/gr-hifi"></iframe></section></main><script>document.querySelectorAll('[data-screen]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b===button));document.querySelectorAll('iframe').forEach(frame=>{const v='b';frame.src='guardrails-option-'+v+'.html?screen='+button.dataset.screen+'#/gr-hifi';document.getElementById('open-'+v).href=frame.src;});});</script></body></html>
