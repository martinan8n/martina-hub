<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multimodal agents</title>
<link rel="stylesheet" href="../styles/n8n-tokens.css?v=1">
<!--
  CONCEPT PROTOTYPE. Everything here is simulated with synthetic data:
  - the photo and video are vector drawings, not uploads
  - the voice is a scripted transcript with a drawn waveform, nothing is recorded
  - the agent's steps, the video, the audio and the copy are scripted, nothing is generated
  Whatever is typed or sent, the agent replies with the next scripted turn.
  URL options: ?demo plays the whole flow by itself, ?end jumps to the finished state.
-->
<style>
  :root {
    --pink: #ff91ac;
    --pink-soft: #ffd3de;
    --pink-ink: #d9436c;
    --page: #fafafa;
    --ink: #161616;
    --ink-2: #5d5d5d;
    --ink-3: #8b8b8b;
    --line: #e6e6e6;
    --line-2: #d4d4d4;
    --green: #2f9e5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-family, InterVariable, system-ui, sans-serif); background: var(--page); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  .ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .fill { fill: currentColor; stroke: none; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .enter { animation: enter .35s ease both; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .app { display: flex; height: 100vh; }

  /* ---- icon rail ---- */
  .rail { width: 56px; flex: none; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
  .rail .btn { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .rail .btn:hover, .rail .btn.on { background: #f1f1f1; }
  .rail .btn svg { width: 18px; height: 18px; }
  .rail .sep { width: 24px; height: 1px; background: var(--line); margin: 8px 0; }
  .rail .grow { flex: 1; }

  /* ---- stage ---- */
  .stage { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .dots { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; pointer-events: none; background-image: radial-gradient(circle, #d9d9d9 1px, transparent 1.2px); background-size: 16px 16px; -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent); }
  .scroll { position: relative; flex: 1; overflow-y: auto; padding: 22px 32px 300px; }
  .col { max-width: 760px; margin: 0 auto; }

  .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; color: var(--ink); font-weight: 500; font-size: 13px; }
  .ghost:hover { background: #f0f0f0; }
  .ghost svg { width: 14px; height: 14px; }
  .ghost.l { margin-left: -10px; } .ghost.r { margin-right: -10px; }

  .agent-head { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .glyph { color: var(--pink-ink); }
  .agent-head #hav { display: flex; }
  .agent-head h1 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .agent-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

  /* ---- thread ---- */
  .user { display: flex; justify-content: flex-end; margin-bottom: 26px; }
  .bubble { background: #f0f0f0; border-radius: 14px; padding: 10px; max-width: 560px; }
  .attach { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .thumb { position: relative; width: 84px; height: 64px; border-radius: 8px; overflow: hidden; flex: none; }
  .thumb svg.scene { width: 100%; height: 100%; }
  .thumb .vtag, .th .vtag { position: absolute; left: 4px; bottom: 4px; display: flex; align-items: center; gap: 4px; background: rgba(22,22,22,.78); color: #fff; font-size: 10px; font-weight: 500; padding: 2px 5px; border-radius: 4px; }
  .thumb .vtag svg, .th .vtag svg { width: 8px; height: 8px; margin: 0; }
  .voice { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; height: 44px; padding: 0 12px 0 8px; }
  .voice .play { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; }
  .voice .play svg { width: 11px; height: 11px; margin-left: 1px; }
  .wave { display: flex; align-items: center; gap: 2px; height: 22px; }
  .wave i { width: 2px; border-radius: 1px; background: var(--ink); }
  .wave i.p { background: var(--pink); }
  .voice .t { font-size: 12px; color: var(--ink-2); white-space: nowrap; padding-left: 4px; }
  .bubble .text { padding: 0 4px 2px; line-height: 1.5; }

  .agent { display: flex; gap: 12px; margin-bottom: 26px; }
  .agent > .av { width: 30px; height: 30px; margin-top: -4px; }
  .agent .body { flex: 1; min-width: 0; }
  .plain { color: var(--ink-2); line-height: 1.5; }

  /* working trace */
  .trace-head { display: inline-flex; align-items: center; gap: 8px; height: 26px; color: var(--ink-2); font-size: 13px; }
  .trace-head:hover { color: var(--ink); }
  .trace-head .chev { width: 14px; height: 14px; transition: transform .2s ease; }
  .trace.open .chev { transform: rotate(90deg); }
  .trace-list { list-style: none; margin: 4px 0 0; padding: 0 0 0 4px; display: none; }
  .trace.open .trace-list { display: block; }
  .trace-list li { display: flex; align-items: center; gap: 10px; height: 26px; color: var(--ink-2); font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
  li.run .dot, .trace.run .head-dot { background: var(--pink); animation: pulse 1.1s ease-in-out infinite; }
  li.done .dot { background: var(--green); }
  .head-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }

  /* result cards */
  .result { margin-top: 14px; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 16px; max-width: 640px; }
  .result h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .result .note { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
  .rhead { margin-bottom: 12px; }
  .rbody { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: stretch; }
  .rside { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .video { position: relative; align-self: start; width: 100%; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; background: #e7b3a6; cursor: pointer; }
  .video svg.scene { width: 100%; height: 100%; }
  .pbtn { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(22,22,22,.86); color: #fff; display: flex; align-items: center; justify-content: center; }
  .pbtn svg { width: 16px; height: 16px; }
  .video.playing .pbtn { opacity: 0; }
  .video:hover .pbtn { opacity: 1; }
  .len { position: absolute; left: 10px; bottom: 10px; background: rgba(22,22,22,.72); color: #fff; font-size: 11px; font-weight: 500; padding: 3px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  .vbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.4); }
  .vbar i { display: block; height: 100%; width: 0; background: var(--pink); }
  .copy .label, .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); }
  .copy .head { margin: 4px 0 2px; font-size: 16px; font-weight: 500; }
  .copy .sub { color: var(--ink-2); line-height: 1.5; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .b { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; font-weight: 500; font-size: 13px; }
  .b svg { width: 14px; height: 14px; }
  .b.ghost2 { margin-left: -14px; }
  .b.ghost2:hover { background: #f0f0f0; }
  .b.primary { background: var(--pink-soft); color: var(--ink); }
  .b.primary:hover { background: #ffc3d2; }
  .audio { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .audio .play { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .audio .play svg { width: 13px; height: 13px; margin-left: 1px; }
  .audio .wave { flex: 1; height: 30px; gap: 3px; }
  .audio .wave i { flex: 1; max-width: 3px; }
  .audio .time { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .script { margin-top: 14px; }
  .script .txt { margin-top: 4px; line-height: 1.55; color: var(--ink); }

  /* ---- composer ---- */
  .composer-wrap { position: absolute; left: 0; right: 0; bottom: 22px; padding: 0 32px; pointer-events: none; }
  .composer { position: relative; pointer-events: auto; max-width: 760px; margin: 0 auto; background: #fff; border: 1.5px solid var(--ink); border-radius: 18px; padding: 14px 14px 12px 16px; }
  .c-attach { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .c-attach:empty { display: none; }
  .chip { display: flex; align-items: center; gap: 8px; height: 50px; padding: 5px 8px 5px 5px; border: 1px solid var(--line); border-radius: 10px; background: #fafafa; font-size: 12.5px; color: var(--ink-2); animation: enter .25s ease both; }
  .chip .thumb { width: 58px; height: 40px; border-radius: 6px; }
  .chip .vch { display: flex; align-items: center; gap: 8px; padding-left: 4px; }
  .chip .vch .play { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; }
  .chip .vch .play svg { width: 9px; height: 9px; margin-left: 1px; }
  .chip .x { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .chip .x:hover { background: #ececec; color: var(--ink); }
  .chip .x svg { width: 12px; height: 12px; }
  .c-text { display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 14px; color: var(--ink); min-height: 24px; max-height: 120px; padding: 0; margin-bottom: 14px; }
  .c-text::placeholder { color: var(--ink-3); }
  .c-text.flash { background: var(--pink-soft); border-radius: 4px; box-shadow: 0 0 0 4px var(--pink-soft); transition: none; }
  .c-text { transition: background-color .9s ease, box-shadow .9s ease; }
  .row { display: flex; align-items: center; gap: 4px; }
  .ib { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .ib:hover, .ib.on { background: #f1f1f1; }
  .ib svg { width: 18px; height: 18px; }
  .sp { flex: 1; }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--pink-soft); display: flex; align-items: center; justify-content: center; margin-left: 4px; transition: opacity .2s ease; }
  .send svg { width: 16px; height: 16px; }
  .send.off { opacity: .45; cursor: default; }
  .menu { position: absolute; left: 12px; bottom: calc(100% + 8px); width: 190px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: none; }
  .menu.open { display: block; animation: enter .15s ease both; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; font-size: 13px; text-align: left; }
  .menu button:hover { background: #f1f1f1; }
  .menu svg { width: 16px; height: 16px; color: var(--ink-2); }

  /* listening: quiet. A blurred glow behind the composer, words land in the text box, small live controls */
  .glow { position: absolute; left: -90px; right: -90px; top: -40px; bottom: -70px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .8s ease;
    background:
      radial-gradient(48% 90% at 18% 100%, rgba(255,145,172,.70), transparent 70%),
      radial-gradient(44% 90% at 52% 108%, rgba(255,199,150,.60), transparent 70%),
      radial-gradient(44% 90% at 86% 100%, rgba(186,170,255,.55), transparent 70%);
    filter: blur(34px); }
  .composer.is-listening .glow { opacity: 1; animation: drift 7s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-26px) scaleX(1); } to { transform: translateX(26px) scaleX(1.06); } }
  .live { display: none; align-items: center; gap: 6px; }
  .composer.is-listening .live { display: flex; }
  .composer.is-listening #mic, .composer.is-listening #send { display: none; }
  .composer.is-listening .c-text { color: var(--ink); }
  .mw { display: flex; align-items: center; gap: 2px; height: 18px; margin-right: 2px; }
  .mw i { width: 2px; height: 100%; border-radius: 1px; background: var(--pink-ink); transform: scaleY(.25); animation: lv 1s ease-in-out infinite; }
  @keyframes lv { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .lt { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: 4px; }
  .stop { width: 34px; height: 34px; border-radius: 50%; background: var(--pink-soft); display: flex; align-items: center; justify-content: center; }
  .stop i { width: 10px; height: 10px; border-radius: 2px; background: var(--ink); }

  /* avatar */
  .av { width: 46px; height: 46px; display: block; flex: none; }
  .av .blob { fill: var(--pink); }
  .av .eyes ellipse, .av .m-wait { fill: var(--ink); }
  .av .eyes-h path, .av .m { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .av .eyes-h, .av .m-work, .av .m-wait, .av .m-happy { display: none; }
  .av .eyes ellipse { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .av[data-s="working"] .m-idle { display: none; } .av[data-s="working"] .m-work { display: block; }
  .av[data-s="working"] .eyes { animation: look 1.7s ease-in-out infinite; }
  @keyframes look { 0%, 100% { transform: translateX(-2.2px); } 50% { transform: translateX(2.2px); } }
  .av[data-s="awaiting"] .m-idle { display: none; } .av[data-s="awaiting"] .m-wait { display: block; }
  .av[data-s="awaiting"] .eyes { transform: translateY(-2px); }
  .av[data-s="happy"] .eyes, .av[data-s="happy"] .m-idle { display: none; }
  .av[data-s="happy"] .eyes-h, .av[data-s="happy"] .m-happy { display: block; }
  .av .eyes, .av { transition: transform .3s ease; }

  /* status next to the agent's name */
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .status .sd { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
  .status.working .sd { background: var(--pink); animation: pulse 1.1s ease-in-out infinite; }
  .status.awaiting .sd { background: #e0a030; }
  .status.done .sd { background: var(--green); }
  .trace.wait .head-dot { background: #e0a030; }

  /* the agent asks, suggests, waits for approval, comes back */
  .ask, .sugg { margin-top: 10px; max-width: 640px; }
  .sugg { margin-top: 14px; }
  .ask .q, .sugg .q { line-height: 1.5; margin-bottom: 8px; }
  .sugg .q { color: var(--ink-2); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { height: 34px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; background: #fff; font-size: 13px; font-weight: 500; }
  .opt:hover { background: #f4f4f4; }
  .opt.sel { background: var(--pink-soft); border-color: var(--pink-soft); }
  .opt.off { pointer-events: none; opacity: .5; }
  .opt.off.sel { opacity: 1; }
  .wfs { margin: 4px 0 2px; }
  .wf { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: flex-start; }
  .wf:first-child { border-top: 0; }
  .wf svg { width: 16px; height: 16px; color: var(--ink-2); margin-top: 2px; }
  .wf .t { font-weight: 500; }
  .wf .s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .wf.done { align-items: center; gap: 10px; }
  .wf.done .dot { background: var(--green); }
  .decided { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); height: 34px; }
  .stats { display: flex; gap: 32px; margin-top: 6px; }
  .stats b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--ink-3); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 6px 0 26px; color: var(--ink-3); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* stronger glow while listening */
  .glow { top: -90px; bottom: -80px; left: -110px; right: -110px;
    background:
      radial-gradient(46% 80% at 16% 100%, rgba(255,120,160,.85), transparent 72%),
      radial-gradient(42% 80% at 50% 108%, rgba(255,190,130,.75), transparent 72%),
      radial-gradient(44% 80% at 86% 100%, rgba(170,150,255,.70), transparent 72%);
    filter: blur(30px); }

  .tag { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .tag i { width: 6px; height: 6px; border-radius: 50%; background: #e0a030; }
  .tag.done i { background: var(--green); }
  .rhead .tag { margin-bottom: 8px; }
  .trail { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
  .noticed { margin-top: 10px; max-width: 640px; }
  .noticed .label { margin-bottom: 6px; }
  .nrow { display: flex; align-items: center; gap: 10px; height: 28px; color: var(--ink-2); font-size: 13px; }
  .nrow svg { width: 15px; height: 15px; color: var(--ink-3); }

  .plan { margin-bottom: 8px; max-width: 640px; }
  .plan .label { margin-bottom: 6px; }
  .prow { display: flex; align-items: center; gap: 10px; height: 26px; color: var(--ink-2); font-size: 13px; }
  .prow b { width: 18px; height: 18px; border-radius: 50%; background: #f0f0f0; color: var(--ink-2); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
  .nrow.k-flag { color: var(--ink); height: auto; padding: 4px 0; align-items: flex-start; line-height: 1.45; }
  .nrow.k-flag svg { color: #d4891a; margin-top: 2px; }
  .chose { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .chose .label { display: block; margin-bottom: 2px; }
  .why { margin: 12px 0 2px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .why .label { display: block; margin-bottom: 2px; }

  /* labelled attachment previews */
  .c-attach { align-items: flex-end; gap: 12px; margin-bottom: 12px; }
  .mc { position: relative; width: 96px; animation: enter .3s ease both; }
  .th { position: relative; width: 100%; height: 64px; border-radius: 8px; overflow: hidden; }
  .th svg.scene { width: 100%; height: 100%; }
  .mc .cap, .vc .cap { margin-top: 5px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc .x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(22,22,22,.72); color: #fff; display: flex; align-items: center; justify-content: center; }
  .mc .x svg { width: 11px; height: 11px; }
  .sepv { align-self: stretch; width: 1px; background: var(--line); margin: 0 2px 22px; }
  .vc { animation: enter .3s ease both; }
  .vc .pill { display: flex; align-items: center; gap: 10px; height: 64px; min-width: 220px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: 10px; background: #fafafa; }
  .vc .play { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .vc .play svg { width: 11px; height: 11px; margin-left: 1px; }
  .vc .x2 { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .vc .x2:hover { background: #ececec; color: var(--ink); }
  .vc .x2 svg { width: 12px; height: 12px; }
  .bubble .attach { align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .bubble .mc { width: 92px; }
  .bubble .mc .th { height: 62px; }
  .bubble .voice { margin-bottom: 0; }
  .bubble .tr { padding: 8px 4px 2px; line-height: 1.5; color: var(--ink-2); }
  .menu button.hot { background: #f1f1f1; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bag-scene" viewBox="0 0 640 360">
      <rect width="640" height="360" fill="#e7b3a6"/>
      <path d="M0 40 L150 0 L210 0 L40 120 L0 120Z" fill="#dca293" opacity=".7"/>
      <path d="M90 0 L190 0 L120 70Z" fill="#d79a8b" opacity=".6"/>
      <rect y="268" width="640" height="92" fill="#d9a395"/>
      <path d="M170 92 H300 L312 300 H158Z" fill="#f4a5b9"/>

<div class="app">

<script>
  function $(id) { return document.getElementById(id); }
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

  // ---------- icons
  var I = {
    play: '<svg class="fill" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
    x: '<svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    pencil: '<svg class="ico" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    chev: '<svg class="ico chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
    glyph: '<svg class="ico" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>'
  };
  var SCENE = '<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice"><use href="#bag-scene"/></svg>';
  var SCENE2 = '<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice"><use href="#roast-scene"/></svg>';


  // the agent's avatar: a small pink blob with a face that follows what the agent is doing
  function AV(state) {
    return '<svg class="av" data-s="' + state + '" viewBox="0 0 64 64" aria-hidden="true">' +
      '<path class="blob" d="M32 4c12 0 23 7 27 18 4 11 0 23-9 31-8 7-21 9-31 4C9 52 3 41 5 28 7 14 19 4 32 4z"/>' +
      '<g class="eyes"><ellipse cx="23.5" cy="29" rx="3.4" ry="4.8"/><ellipse cx="40.5" cy="29" rx="3.4" ry="4.8"/></g>' +
      '<g class="eyes-h"><path d="M19.5 31q4-6 8 0"/><path d="M36.5 31q4-6 8 0"/></g>' +
      '<path class="m m-idle" d="M27 42q5 3.5 10 0"/><path class="m m-work" d="M29 43h6"/><ellipse class="m-wait" cx="32" cy="43" rx="2.2" ry="2.6"/><path class="m m-happy" d="M25 40q7 8 14 0"/>' +
      '</svg>';
  }

  function waveBars(n, pinkCount, seed) {
    var out = "", v = seed || 7;
    for (var i = 0; i < n; i++) {
      v = (v * 9301 + 49297) % 233280;
      var h = 5 + Math.round((v / 233280) * 17);
      out += '<i' + (i < pinkCount ? ' class="p"' : '') + ' style="height:' + h + 'px"></i>';
    }
    return out;
  }

  // ---------- state
  var S = { att: [], lastKind: null, listening: false, busy: false, suggested: null };

  // ---------- composer
  var ta = $("c-text");
  function updateSend() {
    var ok = S.att.length > 0 || ta.value.trim().length > 0;
    $("send").classList.toggle("off", !ok);
  }
  function autosize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; }
  ta.addEventListener("input", function () { autosize(); updateSend(); });
  ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

  function fmt(s) { return "0:" + (s < 10 ? "0" : "") + s; }
  function renderAttach() {
    var h = "", sawMedia = false;
    S.att.forEach(function (a, i) {
      var rm = '<button class="x" data-rm="' + i + '" title="Remove">' + I.x + "</button>";
      if (a.t === "photo") { sawMedia = true; h += '<div class="mc"><div class="th">' + SCENE + rm + '</div><div class="cap">Photo</div></div>'; }
      if (a.t === "video") { sawMedia = true; h += '<div class="mc"><div class="th">' + SCENE2 + '<span class="vtag">' + I.play + '0:30</span>' + rm + '</div><div class="cap">Footage</div></div>'; }
      if (a.t === "voice") {
        h += (sawMedia ? '<span class="sepv"></span>' : "") +
          '<div class="vc"><div class="pill"><span class="play">' + I.play + '</span><span class="wave">' + waveBars(16, 3, 11) + '</span><button class="x2" data-rm="' + i + '" title="Remove">' + I.x + '</button></div><div class="cap">Voice note · ' + fmt(a.dur) + "</div></div>";
      }
    });
    $("c-attach").innerHTML = h;
    updateSend();
  }
  $("c-attach").addEventListener("click", function (e) {
    var b = e.target.closest("[data-rm]"); if (!b) return;
    var removed = S.att.splice(parseInt(b.getAttribute("data-rm"), 10), 1)[0];
    renderAttach();
    if (removed && removed.t !== "voice") setSuggested();
  });

  // attach menu
  function openMenu(open) { $("menu").classList.toggle("open", open); $("plus").classList.toggle("on", open); }
  $("plus").addEventListener("click", function (e) { e.stopPropagation(); openMenu(!$("menu").classList.contains("open")); });
  document.addEventListener("click", function () { openMenu(false); });
  $("menu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-add]"); if (!b) return;
    attach(b.getAttribute("data-add"));
  });
  var P_BOTH = "Create a short launch video from this photo and the roastery footage. Keep it warm and simple.";
  var P_PHOTO = "Create a short launch video for this coffee. Keep it warm and simple.";
  var P_VIDEO = "Turn this video into a 20-second audio ad.";
  function suggestFor() {
    var p = hasMedia("photo"), v = hasMedia("video");
    return p && v ? P_BOTH : p ? P_PHOTO : v ? P_VIDEO : null;
  }
  function setSuggested() {
    // only replace the box if it is empty or still holds an earlier suggestion
    if (ta.value.trim() && ta.value.trim() !== S.suggested) return;
    var next = suggestFor();
    S.suggested = next; ta.value = next || "";
    autosize(); updateSend();
    if (next) {
      ta.classList.add("flash");
      setTimeout(function () { ta.classList.remove("flash"); }, 1100);
      ta.focus();
    }
  }
  var ORDER = { photo: 0, video: 1, voice: 2 };
  function attach(kind) {
    S.att = S.att.filter(function (a) { return a.t !== kind; });
    S.att.push({ t: kind });
    S.att.sort(function (x, y) { return ORDER[x.t] - ORDER[y.t]; });
    openMenu(false); renderAttach();
    setSuggested();
  }

  // ---------- simulated voice
  function hasMedia(kind) { return S.att.some(function (a) { return a.t === kind; }); }
  function phrase() {
    if (S.lastKind === null) {
      var p = hasMedia("photo"), v = hasMedia("video");
      if (p && v) return { text: P_BOTH, dur: 14 };
      if (v) return { text: P_VIDEO, dur: 6 };
      return { text: P_PHOTO, dur: 12 };
    }
    if (S.lastKind === "video1") return { text: "Make it a bit shorter and more upbeat.", dur: 5 };
    if (S.lastKind === "audio1") return { text: "A little slower, with a softer ending.", dur: 5 };
    return { text: "That works, thanks.", dur: 3 };
  }
  var L = { words: [], n: 0, tick: null, p: null, base: "" };
  function startListen() {
    if (S.listening || S.busy) return;
    S.listening = true; openMenu(false);
    L.p = phrase(); L.words = L.p.text.split(" "); L.n = 0;
    // speaking replaces an untouched suggestion; otherwise it adds to what is already typed
    L.base = (ta.value.trim() === S.suggested) ? "" : ta.value.trim();
    if (!L.base) ta.value = "";
    S.suggested = null; ta.readOnly = true;
    var bars = ""; for (var i = 0; i < 5; i++) bars += '<i style="animation-delay:' + (i * 120) + 'ms;animation-duration:' + (780 + i * 90) + 'ms"></i>';
    $("mw").innerHTML = bars; $("l-time").textContent = "0:00";
    $("composer").classList.add("is-listening");
    var total = L.words.length, ms = (MM.dict || 3400) / total;
    L.tick = setInterval(function () {
      L.n++;
      var said = L.words.slice(0, L.n).join(" ");
      ta.value = (L.base ? L.base + " " : "") + said; autosize(); updateSend();
      $("l-time").textContent = fmt(Math.round(L.p.dur * L.n / total));
      if (L.n >= total) clearInterval(L.tick);
    }, ms);
  }
  function stopListen(keep) {
    if (!S.listening) return;
    clearInterval(L.tick);
    S.listening = false; ta.readOnly = false;
    $("composer").classList.remove("is-listening");
    if (keep) {
      // finish the sentence if stopped early, and keep the recording as a small chip
      ta.value = (L.base ? L.base + " " : "") + L.p.text; autosize();
      S.att = S.att.filter(function (a) { return a.t !== "voice"; });
      S.att.push({ t: "voice", dur: L.p.dur, tr: L.p.text });
      renderAttach();
    } else {
      ta.value = L.base; autosize(); updateSend();
    }
  }
  $("mic").addEventListener("click", startListen);
  $("l-cancel").addEventListener("click", function () { stopListen(false); });
  $("l-done").addEventListener("click", function () { stopListen(true); });

  // ---------- thread
  var thread = $("thread");
  // hooks for filming: build the story up to any point instantly, hold at a pending choice, slow everything down
  var MM = window.mm = { instant: false, hold: false, slow: 1 };
  (function () { var m = /slow=([\d.]+)/.exec(location.search); if (m) MM.slow = parseFloat(m[1]); })();
  $("hav").innerHTML = AV("idle");
  function scrollDown() { var s = $("scroll"); s.scrollTo({ top: s.scrollHeight, behavior: "smooth" }); }
  function el(html, cls) { var d = document.createElement("div"); d.className = cls; d.innerHTML = html; thread.appendChild(d); return d; }

  function userBubble(att, text) {
    var media = att.filter(function (x) { return x.t !== "voice"; }), voice = null;
    att.forEach(function (x) { if (x.t === "voice") voice = x; });
    var m = media.map(function (x) {
      return x.t === "photo"
        ? '<div class="mc"><div class="th">' + SCENE + '</div><div class="cap">Photo</div></div>'
        : '<div class="mc"><div class="th">' + SCENE2 + '<span class="vtag">' + I.play + '0:30</span></div><div class="cap">Footage</div></div>';
    }).join("");
    var asTranscript = voice && voice.tr && text === voice.tr;
    var v = voice ? '<div class="voice"><span class="play">' + I.play + '</span><span class="wave">' + waveBars(24, 5, 7) + '</span><span class="t">Voice note · ' + fmt(voice.dur) + "</span></div>" : "";
    var html = '<div class="bubble">' + (m ? '<div class="attach">' + m + "</div>" : "") + v +
      (asTranscript ? '<div class="tr"></div>' : (text ? '<div class="text"></div>' : "")) + "</div>";
    var d = el(html, "user enter");
    if (asTranscript) d.querySelector(".tr").textContent = "“" + text + "”";
    else if (text) d.querySelector(".text").textContent = text;
    scrollDown();
  }

  // quiet status next to the agent's name: what the agent is doing, or waiting for
  function setStatus(kind, text) {
    $("status").className = "status " + kind; $("status-t").textContent = text;
    var map = { working: "working", awaiting: "awaiting", done: "happy", idle: "idle" }, h = $("hav").firstChild;
    if (h) h.setAttribute("data-s", map[kind] || "idle");
  }

  function sleep(ms) { return new Promise(function (r) { later(r, ms * MM.slow); }); }
  function until(fn) { return new Promise(function (r) { (function poll() { if (fn()) r(); else later(poll, 100); })(); }); }

  // ---------- cards
  var WF = '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>';
  var SCRIPT = "A fresh start, one cup at a time. Meet our smooth, balanced coffee, made for your morning ritual. Try it this week.";

  function cardHtml(c) {
    var note = c.note ? '<p class="note">' + c.note + "</p>" : "";
    var head = '<div class="rhead"><h2>' + c.title + "</h2>" + note + "</div>";
    if (c.kind === "video") {
      return head + '<div class="rbody"><div class="video" data-total="' + c.dur + '">' + SCENE + '<span class="pbtn">' + I.play + '</span><span class="len">' + fmt(c.dur) + '</span><span class="vbar"><i></i></span></div>' +
        '<div class="rside"><div class="copy"><div class="label">SUGGESTED COPY</div><div class="head">' + c.head + '</div><div class="sub">' + c.sub + "</div></div>" +
        (c.chose ? '<div class="chose"><span class="label">I CHOSE</span>' + c.chose + "</div>" : "") +
        '<div class="actions"><button class="b ghost2">' + I.pencil + 'Edit</button><button class="b primary" data-use="1">Use this version</button></div></div></div>';
    }
    if (c.kind === "audio") {
      return head + '<div class="audio" data-total="' + c.dur + '"><span class="play">' + I.play + '</span><span class="wave">' + waveBars(48, 0, 5) + '</span><span class="time">0:00 / ' + fmt(c.dur) + "</span></div>" +
        '<div class="script"><div class="label">SCRIPT</div><div class="txt">' + c.script + "</div></div>" +
        '<div class="actions"><button class="b ghost2">' + I.pencil + 'Edit script</button><button class="b primary" data-use="1">Use this version</button></div>';
    }
    if (c.kind === "approve") {
      head = '<div class="rhead"><div class="tag"><i></i><span>Your turn</span></div><h2>' + c.title + "</h2>" + note + "</div>";
      return head + '<div class="wfs">' +
        '<div class="wf">' + WF + '<div><div class="t">Schedule the video on LinkedIn</div><div class="s">Thursday, 9:00 · workflow: Post to LinkedIn</div></div></div>' +
        '<div class="wf">' + WF + '<div><div class="t">Share it with the team in Slack</div><div class="s">#marketing · workflow: Notify team</div></div></div>' +
        '<div class="wf">' + WF + '<div><div class="t">Log the campaign</div><div class="s">Campaign tracker · workflow: Log campaign</div></div></div></div>' +
        '<div class="why"><span class="label">WHY THURSDAY, 9:00</span>Your last three launches got the most views then.</div>' +
        '<div class="actions"><button class="b ghost2" data-act="change">Change</button><button class="b primary" data-act="go">Approve and run</button></div>';
    }
    if (c.kind === "done") {
      return head + '<div class="wfs">' +
        '<div class="wf done"><span class="dot"></span><div class="t">LinkedIn post scheduled for Thursday, 9:00</div></div>' +
        '<div class="wf done"><span class="dot"></span><div class="t">Team notified in #marketing</div></div>' +
        '<div class="wf done"><span class="dot"></span><div class="t">Campaign added to the tracker</div></div></div>';
    }
    // report
    return head + '<div class="stats"><div><b>1,204</b><span>views</span></div><div><b>38</b><span>reactions</span></div><div><b>6</b><span>comments</span></div></div>';
  }

  // fake playback (progress only, no media)
  function wirePlayer(card) {
    var v = card.querySelector(".video, .audio"); if (!v) return;
    var total = parseInt(v.getAttribute("data-total"), 10), t = 0, timer = null;
    function paint() {
      if (v.classList.contains("video")) { v.querySelector(".vbar i").style.width = (t / total * 100) + "%"; v.querySelector(".len").textContent = fmt(Math.max(0, Math.ceil(total - t))); }
      else {
        var bars = v.querySelectorAll(".wave i"), k = Math.floor(bars.length * t / total);
        bars.forEach(function (b, i) { b.className = i < k ? "p" : ""; });
        v.querySelector(".time").textContent = fmt(Math.floor(t)) + " / " + fmt(total);
      }
    }
    function stop() { clearInterval(timer); timer = null; v.classList.remove("playing"); }
    v.addEventListener("click", function () {
      if (timer) { stop(); return; }
      v.classList.add("playing");
      timer = setInterval(function () { t += 0.1; if (t >= total) { t = 0; stop(); } paint(); }, 100);
    });
  }

  // ---------- the agent as an actor: works, asks, suggests, waits for approval, comes back
  function choices(body, q, opts, fast, cls, auto) {
    var box = document.createElement("div"); box.className = cls + " enter";
    box.innerHTML = '<div class="tag"><i></i><span>Your turn</span></div><div class="q">' + q + '</div><div class="opts">' +
      opts.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + o + "</button>"; }).join("") + "</div>";
    body.appendChild(box); scrollDown();
    return new Promise(function (res) {
      function pick(i) {
        box.querySelectorAll(".opt").forEach(function (b, k) { b.classList.add("off"); if (k === i) b.classList.add("sel"); });
        box.querySelector(".tag").classList.add("done"); box.querySelector(".tag span").textContent = "You chose";
        res(i);
      }
      if ((fast || MM.instant) && auto && !MM.hold) { pick(0); return; }
      box.querySelector(".opts").addEventListener("click", function (e) {
        var b = e.target.closest(".opt"); if (!b || b.classList.contains("off")) return;
        pick(parseInt(b.getAttribute("data-i"), 10));
      });
    });
  }

  function plainAgent(fast) {
    var d = el(AV("idle") + '<div class="body"></div>', "agent enter");
    var body = d.querySelector(".body");
    return {
      body: body,
      say: function (text) { var p = document.createElement("div"); p.className = "plain"; p.textContent = text; body.appendChild(p); scrollDown(); },
      suggest: function (q, opts, auto) { return choices(body, q, opts, fast, "sugg", auto !== false); }
    };
  }

  function newAgent(fast) {
    var d = el(AV("working") + '<div class="body"><div class="trace open run"><button class="trace-head">' + I.chev +
      '<span class="head-dot"></span><span class="lbl">Working…</span></button><ul class="trace-list"></ul></div></div>', "agent enter");
    var body = d.querySelector(".body"), trace = d.querySelector(".trace"), list = d.querySelector(".trace-list"), lbl = d.querySelector(".lbl"), av = d.querySelector(".av");
    trace.querySelector(".trace-head").addEventListener("click", function () { trace.classList.toggle("open"); });
    var A = { body: body };
    A.step = function (txt) {
      return new Promise(function (res) {
        var quick = fast || MM.instant; var li = document.createElement("li"); li.className = quick ? "done" : "run";
        li.innerHTML = '<span class="dot"></span><span>' + txt + "</span>"; list.appendChild(li);
        if (quick) { res(); return; }
        scrollDown();
        later(function () { li.classList.remove("run"); li.classList.add("done"); res(); }, 1000 * MM.slow);
      });
    };
    A.pause = function (label) { trace.classList.remove("run"); trace.classList.add("wait"); lbl.textContent = label; av.setAttribute("data-s", "awaiting"); };
    A.resume = function () { trace.classList.remove("wait"); trace.classList.add("run"); lbl.textContent = "Working…"; av.setAttribute("data-s", "working"); };
    A.finish = function (worked, c) {
      trace.classList.remove("run", "wait", "open");
      lbl.textContent = "Worked for " + worked;
      av.setAttribute("data-s", "happy"); later(function () { av.setAttribute("data-s", "idle"); }, 1800);
      var card = document.createElement("div"); card.className = "result enter"; card.innerHTML = cardHtml(c);
      body.appendChild(card); wirePlayer(card); scrollDown();
      return card;
    };
    A.plan = function (items) {
      var p = document.createElement("div"); p.className = "plan enter";
      p.innerHTML = '<div class="label">MY PLAN</div>' + items.map(function (t, i) { return '<div class="prow"><b>' + (i + 1) + "</b><span>" + t + "</span></div>"; }).join("");
      body.insertBefore(p, trace); scrollDown();
    };
    A.noticed = function (items) {
      var ic = {
        photo: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
        video: '<svg class="ico" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/></svg>',
        voice: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>',
        flag: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
      };
      var n = document.createElement("div"); n.className = "noticed enter";
      n.innerHTML = '<div class="label">WHAT I NOTICED</div>' + items.map(function (x) { return '<div class="nrow k-' + x.k + '">' + ic[x.k] + "<span>" + x.t + "</span></div>"; }).join("");
      body.appendChild(n); scrollDown();
    };
    A.ask = function (q, opts) { return choices(body, q, opts, fast, "ask", true); };
    A.suggest = function (q, opts, auto) { return choices(body, q, opts, fast, "sugg", auto !== false); };
    return A;
  }

  function chain(A, steps) { return steps.reduce(function (p, s) { return p.then(function () { return A.step(s); }); }, Promise.resolve()); }
  function ready(text) { S.busy = false; setStatus("idle", text || "Your turn"); }
  function working(text) { S.busy = true; setStatus("working", text || "Working"); }

  // 1. photo, footage and voice in. The agent shows what it took from each, asks where it will run, then makes the video
  function storyVideo1(fast) {
    working();
    var A = newAgent(fast), CH = ["LinkedIn", "Instagram", "Both"], P = S.sent || { photo: true, video: false };
    var looks = [], seen = [];
    A.plan(["Study what you gave me", "Check where it will run", "Make the video and the copy", "Offer an audio version", "Ask for your OK before anything is published"]);
    if (P.photo) { looks.push("Looking at your photo"); seen.push({ k: "photo", t: "Pink coffee bag, warm peach tones" }); }
    if (P.video) { looks.push("Watching your footage"); seen.push({ k: "video", t: "Three usable moments: pouring, steam, first sip" }); }
    looks.push("Listening to your brief", "Reading your brand voice"); seen.push({ k: "voice", t: "Tone: warm and simple" });
    if (P.photo && P.video) seen.push({ k: "flag", t: "Heads up: the footage has no logo, so I will bring in the bag from your photo" });
    return chain(A, looks).then(function () {
      A.noticed(seen);
      A.pause("Waiting for your answer"); setStatus("awaiting", "Waiting for your answer");
      return A.ask("Where will this run?", CH);
    }).then(function (i) {
      S.channel = CH[i]; A.resume(); working();
      var where = i === 2 ? "LinkedIn and Instagram" : CH[i];
      var from = P.photo && P.video ? "your photo and three moments from your footage" : "your photo";
      return chain(A, ["Drafting the script for " + (i === 2 ? "both channels" : CH[i]), "Cutting the video"]).then(function () {
        var n = looks.length + 2;
        var ratio = i === 0 ? "16:9" : i === 1 ? "9:16" : "16:9 and 9:16";
        A.finish((n + 1) + " s · " + n + " steps", { kind: "video", title: "Your launch video", note: "Made for " + where + " · built from " + from, chose: ratio + " for " + where + " · 18 s · warm acoustic music · opens on the pour", dur: 18, head: "Meet your new morning ritual.", sub: "Smooth, balanced coffee for focused mornings." });
        S.lastKind = "video1"; ready();
      });
    });
  }

  // 2. voice revision, then the agent offers the audio version on its own
  function storyVideo2(fast) {
    working();
    var A = newAgent(fast);
    return chain(A, ["Reading your change", "Trimming the video", "Adjusting the music"]).then(function () {
      A.finish("3 s · 3 steps", { kind: "video", title: "Your launch video · Draft 2", note: "Shorter by 4 s · more upbeat music", chose: "Cut 4 s from the middle · music tempo up a little · kept the ending", dur: 14, head: "Meet your new morning ritual.", sub: "Smooth, balanced coffee for focused mornings." });
      S.lastKind = "video2"; ready();
      return A.suggest("I can also turn this into a 20-second audio ad for radio and podcasts.", ["Make the audio ad", "Not now"]).then(function (i) {
        if (i === 0) { userBubble([], "Make the audio ad"); return storyAudioFromDraft(fast); }
      });
    });
  }

  function storyAudioFromDraft(fast) {
    working();
    var A = newAgent(fast);
    return chain(A, ["Taking the script from Draft 2", "Recording the voiceover", "Matching the 20-second length"]).then(function () {
      A.finish("4 s · 3 steps", { kind: "audio", title: "Your audio ad", note: "Adapted from Draft 2", dur: 20, script: SCRIPT });
      S.audioDone = true; ready();
    });
  }

  // alternate path: a video comes in, an audio ad goes out
  function storyAudio1(fast) {
    working();
    var A = newAgent(fast);
    return chain(A, ["Watching your video", "Pulling out the key lines", "Writing a 20-second script", "Recording the voiceover"]).then(function () {
      A.finish("5 s · 4 steps", { kind: "audio", title: "Your audio ad", note: "Adapted from Roastery_footage.mp4", dur: 20, script: SCRIPT });
      S.lastKind = "audio1"; ready();
    });
  }
  function storyAudio2(fast) {
    working();
    var A = newAgent(fast);
    return chain(A, ["Reading your change", "Slowing the pace", "Softening the ending"]).then(function () {
      A.finish("3 s · 3 steps", { kind: "audio", title: "Your audio ad · Draft 2", note: "Slower pace · softer ending", dur: 22, script: SCRIPT });
      S.lastKind = "audio2"; ready();
    });
  }

  // 3. approval: the agent says exactly what will run, and waits
  function storyApproval(fast) {
    working();
    var A = newAgent(fast);
    return A.step("Checking your connected tools").then(function () {
      var card = A.finish("2 s · 1 step", { kind: "approve", title: "Ready to publish?", note: "Nothing runs until you approve." });
      S.busy = false; setStatus("awaiting", "Waiting for your approval");
      return new Promise(function (res) {
        function decide(act) {
          var go = act === "go", parts = [];
          if (go) {
            if (S.channel) parts.push(S.channel === "Both" ? "LinkedIn and Instagram" : S.channel);
            parts.push(S.lastKind === "video2" ? "Draft 2" : "Draft 1");
            if (S.audioDone) parts.push("audio ad included");
          }
          card.querySelector(".actions").innerHTML = go
            ? '<span class="decided"><span class="dot" style="background:var(--green)"></span>Approved</span>'
            : '<span class="decided"><span class="dot"></span>Not now</span>';
          var tag = card.querySelector(".tag"); tag.classList.add("done"); tag.querySelector("span").textContent = go ? "You approved" : "You paused";
          if (go) { var tr = document.createElement("div"); tr.className = "trail"; tr.textContent = "You decided · " + parts.join(" · "); card.appendChild(tr); }
          res(act);
        }
        if (fast) { decide("go"); return; }
        card.addEventListener("click", function (e) {
          var b = e.target.closest("[data-act]"); if (!b || !card.querySelector(".actions .b")) return;
          decide(b.getAttribute("data-act"));
        });
      });
    }).then(function (act) {
      if (act !== "go") { var P = plainAgent(fast); P.say("Sure. Tell me what to change."); S.approving = false; ready(); return; }
      return storyRun(fast);
    });
  }

  // 4. it runs the workflows, then reports what happened
  function storyRun(fast) {
    working("Running your workflows");
    var A = newAgent(fast);
    return chain(A, ["Post to LinkedIn · scheduled for Thursday, 9:00", "Notify the team in Slack", "Log to the Campaign tracker"]).then(function () {
      A.finish("4 s · 3 workflows", { kind: "done", title: "Scheduled", note: "I'll check how it performs and report back." });
      S.approving = false; S.busy = false; setStatus("done", "Scheduled");
      return (fast || MM.instant) ? null : sleep(2800);
    }).then(function () { return storyReport(fast); });
  }

  // 5. later, the agent comes back on its own
  function storyReport(fast) {
    el('<div class="divider"><span>Thursday · 11:04</span></div>', "enter");
    var P = plainAgent(fast);
    var card = document.createElement("div"); card.className = "result enter";
    card.innerHTML = cardHtml({ kind: "report", title: "Your launch video is live", note: "On LinkedIn · 2 hours in" });
    P.body.appendChild(card);
    S.reported = true; setStatus("idle", "Reported back"); scrollDown();
    P.suggest("Want me to repeat it on Instagram?", ["Repeat on Instagram", "Not now"], false).then(function (i) {
      if (i === 0) { userBubble([], "Repeat on Instagram"); plainAgent(false).say("That is as far as this demo goes for now."); }
    });
  }

  function useVersion() {
    if (S.busy || S.approving || S.listening) return;
    S.approving = true;
    userBubble([], "Use this version");
    storyApproval(false);
  }
  thread.addEventListener("click", function (e) { if (e.target.closest("[data-use]")) useVersion(); });

  function replyFor() {
    if (S.lastKind === null) return (hasMedia("video") && !hasMedia("photo")) ? "audio1" : "video1";
    if (S.lastKind === "video1") return "video2";
    if (S.lastKind === "audio1") return "audio2";
    return null;
  }

  function send() {
    if (S.busy || S.listening) return;
    var text = ta.value.trim();
    if (!S.att.length && !text) return;
    var key = replyFor();
    S.sent = { photo: hasMedia("photo"), video: hasMedia("video") };
    userBubble(S.att.slice(), text);
    S.att = []; S.suggested = null; ta.value = ""; autosize(); renderAttach();
    if (key === "video1") storyVideo1(false);
    else if (key === "video2") storyVideo2(false);
    else if (key === "audio1") storyAudio1(false);
    else if (key === "audio2") storyAudio2(false);
    else { plainAgent(false).say("That is as far as this demo goes for now."); }
  }
  $("send").addEventListener("click", send);

  // ---------- reset, demo, finished state
  function resetAll() {
    timers.forEach(clearTimeout); timers = [];
    clearInterval(L.tick); S = { att: [], lastKind: null, listening: false, busy: false, suggested: null, approving: false };
    $("composer").classList.remove("is-listening"); ta.readOnly = false; openMenu(false);
    thread.innerHTML = ""; ta.value = ""; autosize(); renderAttach();
    setStatus("idle", "Ready");
  }

  // plays the whole story: attach, speak, answer a question, revise, accept a suggestion, approve, come back
  function demo() {
    resetAll();
    var pick = function (sel) { var b = document.querySelector(sel); if (b) b.click(); };
    var hot = function (k) { var b = document.querySelector('.menu [data-add="' + k + '"]'); if (b) { b.classList.add("hot"); setTimeout(function () { b.classList.remove("hot"); }, 500); } };
    sleep(900).then(function () { openMenu(true); return sleep(800); })
      .then(function () { hot("photo"); return sleep(550); })
      .then(function () { attach("photo"); return sleep(1900); })
      .then(function () { openMenu(true); return sleep(700); })
      .then(function () { hot("video"); return sleep(550); })
      .then(function () { attach("video"); return sleep(1900); })
      .then(function () { startListen(); return sleep(4300); })
      .then(function () { stopListen(true); return sleep(1000); })
      .then(function () { send(); return until(function () { return document.querySelector(".ask .opt:not(.off)"); }); })
      .then(function () { return sleep(1500); })
      .then(function () { pick(".ask .opt"); return until(function () { return S.lastKind === "video1" && !S.busy; }); })
      .then(function () { return sleep(2200); })
      .then(function () { startListen(); return sleep(3400); })
      .then(function () { stopListen(true); return sleep(900); })
      .then(function () { send(); return until(function () { return document.querySelector(".sugg .opt:not(.off)"); }); })
      .then(function () { return sleep(2000); })
      .then(function () { pick(".sugg .opt"); return until(function () { return S.audioDone; }); })
      .then(function () { return sleep(2400); })
      .then(function () { var all = document.querySelectorAll(".result .video ~ .rside [data-use], .result [data-use]"); var v = document.querySelectorAll(".result .rbody [data-use]"); (v[v.length - 1] || all[0]).click(); return until(function () { return document.querySelector("[data-act=go]"); }); })
      .then(function () { return sleep(3000); })
      .then(function () { pick("[data-act=go]"); });
  }

  function endState() {
    resetAll();
    S.sent = { photo: true, video: true };
    userBubble([{ t: "photo" }, { t: "video" }, { t: "voice", dur: 14, tr: P_BOTH }], P_BOTH);
    storyVideo1(true).then(function () {
      userBubble([{ t: "voice", dur: 5, tr: "Make it a bit shorter and more upbeat." }], "Make it a bit shorter and more upbeat.");
      return storyVideo2(true);
    }).then(function () {
      userBubble([], "Use this version"); S.approving = true;
      return storyApproval(true);
    }).then(function () { $("scroll").scrollTop = $("scroll").scrollHeight; });
  }

  // build the conversation instantly up to a named point (used when filming one scene at a time)
  MM.build = function (name) {
    resetAll(); MM.instant = true; MM.hold = false;
    var REV = "Make it a bit shorter and more upbeat.";
    function done() { MM.instant = false; MM.hold = false; var sc = $("scroll"); sc.scrollTop = sc.scrollHeight; }
    function composed() { S.att = [{ t: "photo" }, { t: "video" }, { t: "voice", dur: 14, tr: P_BOTH }]; S.suggested = null; ta.value = P_BOTH; autosize(); renderAttach(); }
    function revision() { S.att = [{ t: "voice", dur: 5, tr: REV }]; ta.value = REV; autosize(); renderAttach(); }
    var p = Promise.resolve();
    if (name === "empty") { done(); return p; }
    composed();
    if (name === "composed") { done(); return p; }
    if (name === "asking") { MM.hold = true; send(); return until(function () { return document.querySelector(".ask .opt:not(.off)"); }).then(done); }
    send();
    p = until(function () { return S.lastKind === "video1" && !S.busy; });
    if (name === "video1") return p.then(done);
    p = p.then(revision);
    if (name === "revision") return p.then(done);
    if (name === "offer") return p.then(function () { MM.hold = true; send(); return until(function () { return document.querySelector(".sugg .opt:not(.off)"); }); }).then(done);
    p = p.then(function () { send(); return until(function () { return S.audioDone; }); });
    if (name === "audio") return p.then(done);
    return p.then(function () { useVersion(); return until(function () { return document.querySelector("[data-act=go]"); }); }).then(done);   // "approving"
  };

  $("demo-btn").addEventListener("click", demo);
  setStatus("idle", "Ready");
  var q = location.search;
  if (q.indexOf("end") > -1) endState(); else if (q.indexOf("demo") > -1) demo();
</script>
</body>
</html>
