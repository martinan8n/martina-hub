<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multimodal agents</title>
<link rel="stylesheet" href="../styles/n8n-tokens.css?v=1">
<!--
  CONCEPT PROTOTYPE. Everything here is simulated with synthetic data:
  - the photo and video are vector drawings, not uploads
  - the voice is a scripted transcript with a drawn waveform, nothing is recorded
  - the agent's steps, the video, the audio and the copy are scripted, nothing is generated
  Whatever is typed or sent, the agent replies with the next scripted turn.
  URL options: ?demo plays the whole flow by itself, ?end jumps to the finished state.
-->
<style>
  :root {
    --pink: #ff91ac;
    --pink-soft: #ffd3de;
    --pink-ink: #d9436c;
    --page: #fafafa;
    --ink: #161616;
    --ink-2: #5d5d5d;
    --ink-3: #8b8b8b;
    --line: #e6e6e6;
    --line-2: #d4d4d4;
    --green: #2f9e5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-family, InterVariable, system-ui, sans-serif); background: var(--page); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  .ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .fill { fill: currentColor; stroke: none; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .enter { animation: enter .35s ease both; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .app { display: flex; height: 100vh; }

  /* ---- icon rail ---- */
  .rail { width: 56px; flex: none; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
  .rail .btn { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .rail .btn:hover, .rail .btn.on { background: #f1f1f1; }
  .rail .btn svg { width: 18px; height: 18px; }
  .rail .sep { width: 24px; height: 1px; background: var(--line); margin: 8px 0; }
  .rail .grow { flex: 1; }

  /* ---- stage ---- */
  .stage { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  .dots { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; pointer-events: none; background-image: radial-gradient(circle, #d9d9d9 1px, transparent 1.2px); background-size: 16px 16px; -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent); }
  .scroll { position: relative; flex: 1; overflow-y: auto; padding: 22px 32px 300px; }
  .col { max-width: 760px; margin: 0 auto; }

  .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; color: var(--ink); font-weight: 500; font-size: 13px; }
  .ghost:hover { background: #f0f0f0; }
  .ghost svg { width: 14px; height: 14px; }
  .ghost.l { margin-left: -10px; } .ghost.r { margin-right: -10px; }

  .agent-head { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .glyph { color: var(--pink-ink); }
  .agent-head .glyph svg { width: 26px; height: 26px; }
  .agent-head h1 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .agent-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

  /* ---- thread ---- */
  .user { display: flex; justify-content: flex-end; margin-bottom: 26px; }
  .bubble { background: #f0f0f0; border-radius: 14px; padding: 10px; max-width: 560px; }
  .attach { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .thumb { position: relative; width: 84px; height: 64px; border-radius: 8px; overflow: hidden; flex: none; }
  .thumb svg.scene { width: 100%; height: 100%; }
  .thumb .vtag { position: absolute; left: 4px; bottom: 4px; display: flex; align-items: center; gap: 4px; background: rgba(22,22,22,.78); color: #fff; font-size: 10px; font-weight: 500; padding: 2px 5px; border-radius: 4px; }
  .thumb .vtag svg { width: 8px; height: 8px; }
  .voice { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 10px; height: 44px; padding: 0 12px 0 8px; }
  .voice .play { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; }
  .voice .play svg { width: 11px; height: 11px; margin-left: 1px; }
  .wave { display: flex; align-items: center; gap: 2px; height: 22px; }
  .wave i { width: 2px; border-radius: 1px; background: var(--ink); }
  .wave i.p { background: var(--pink); }
  .voice .t { font-size: 12px; color: var(--ink-2); white-space: nowrap; padding-left: 4px; }
  .bubble .text { padding: 0 4px 2px; line-height: 1.5; }

  .agent { display: flex; gap: 12px; margin-bottom: 26px; }
  .agent > .glyph { margin-top: 1px; }
  .agent > .glyph svg { width: 20px; height: 20px; }
  .agent .body { flex: 1; min-width: 0; }
  .plain { color: var(--ink-2); line-height: 1.5; }

  /* working trace */
  .trace-head { display: inline-flex; align-items: center; gap: 8px; height: 26px; color: var(--ink-2); font-size: 13px; }
  .trace-head:hover { color: var(--ink); }
  .trace-head .chev { width: 14px; height: 14px; transition: transform .2s ease; }
  .trace.open .chev { transform: rotate(90deg); }
  .trace-list { list-style: none; margin: 4px 0 0; padding: 0 0 0 4px; display: none; }
  .trace.open .trace-list { display: block; }
  .trace-list li { display: flex; align-items: center; gap: 10px; height: 26px; color: var(--ink-2); font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
  li.run .dot, .trace.run .head-dot { background: var(--pink); animation: pulse 1.1s ease-in-out infinite; }
  li.done .dot { background: var(--green); }
  .head-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }

  /* result cards */
  .result { margin-top: 14px; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 16px; max-width: 640px; }
  .result h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .result .note { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-2); }
  .rhead { margin-bottom: 12px; }
  .rbody { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: stretch; }
  .rside { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .video { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; background: #e7b3a6; cursor: pointer; }
  .video svg.scene { width: 100%; height: 100%; }
  .pbtn { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(22,22,22,.86); color: #fff; display: flex; align-items: center; justify-content: center; }
  .pbtn svg { width: 16px; height: 16px; }
  .video.playing .pbtn { opacity: 0; }
  .video:hover .pbtn { opacity: 1; }
  .len { position: absolute; left: 10px; bottom: 10px; background: rgba(22,22,22,.72); color: #fff; font-size: 11px; font-weight: 500; padding: 3px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  .vbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.4); }
  .vbar i { display: block; height: 100%; width: 0; background: var(--pink); }
  .copy .label, .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); }
  .copy .head { margin: 4px 0 2px; font-size: 16px; font-weight: 500; }
  .copy .sub { color: var(--ink-2); line-height: 1.5; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .b { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; font-weight: 500; font-size: 13px; }
  .b svg { width: 14px; height: 14px; }
  .b.ghost2 { margin-left: -14px; }
  .b.ghost2:hover { background: #f0f0f0; }
  .b.primary { background: var(--pink-soft); color: var(--ink); }
  .b.primary:hover { background: #ffc3d2; }
  .audio { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .audio .play { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
  .audio .play svg { width: 13px; height: 13px; margin-left: 1px; }
  .audio .wave { flex: 1; height: 30px; gap: 3px; }
  .audio .wave i { flex: 1; max-width: 3px; }
  .audio .time { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .script { margin-top: 14px; }
  .script .txt { margin-top: 4px; line-height: 1.55; color: var(--ink); }

  /* ---- composer ---- */
  .composer-wrap { position: absolute; left: 0; right: 0; bottom: 22px; padding: 0 32px; pointer-events: none; }
  .composer { position: relative; pointer-events: auto; max-width: 760px; margin: 0 auto; background: #fff; border: 1.5px solid var(--ink); border-radius: 18px; padding: 14px 14px 12px 16px; }
  .c-attach { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .c-attach:empty { display: none; }
  .chip { display: flex; align-items: center; gap: 8px; height: 50px; padding: 5px 8px 5px 5px; border: 1px solid var(--line); border-radius: 10px; background: #fafafa; font-size: 12.5px; color: var(--ink-2); animation: enter .25s ease both; }
  .chip .thumb { width: 58px; height: 40px; border-radius: 6px; }
  .chip .vch { display: flex; align-items: center; gap: 8px; padding-left: 4px; }
  .chip .vch .play { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; }
  .chip .vch .play svg { width: 9px; height: 9px; margin-left: 1px; }
  .chip .x { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .chip .x:hover { background: #ececec; color: var(--ink); }
  .chip .x svg { width: 12px; height: 12px; }
  .c-text { display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 14px; color: var(--ink); min-height: 24px; max-height: 120px; padding: 0; margin-bottom: 14px; }
  .c-text::placeholder { color: var(--ink-3); }
  .c-text.flash { background: var(--pink-soft); border-radius: 4px; box-shadow: 0 0 0 4px var(--pink-soft); transition: none; }
  .c-text { transition: background-color .9s ease, box-shadow .9s ease; }
  .row { display: flex; align-items: center; gap: 4px; }
  .ib { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .ib:hover, .ib.on { background: #f1f1f1; }
  .ib svg { width: 18px; height: 18px; }
  .sp { flex: 1; }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--pink-soft); display: flex; align-items: center; justify-content: center; margin-left: 4px; transition: opacity .2s ease; }
  .send svg { width: 16px; height: 16px; }
  .send.off { opacity: .45; cursor: default; }
  .menu { position: absolute; left: 12px; bottom: calc(100% + 8px); width: 190px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: none; }
  .menu.open { display: block; animation: enter .15s ease both; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; font-size: 13px; text-align: left; }
  .menu button:hover { background: #f1f1f1; }
  .menu svg { width: 16px; height: 16px; color: var(--ink-2); }

  .listen { display: none; }
  .composer.is-listening .idle { display: none; }
  .composer.is-listening .listen { display: block; }
  .l-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .l-top .t { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
  .l-top .t i { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); animation: pulse 1.1s ease-in-out infinite; }
  .l-top .time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .l-wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 64px; margin: 4px 0 10px; }
  .l-wave i { width: 3px; height: 100%; border-radius: 2px; background: #3a3a3a; transform: scaleY(.15); animation: lv 1s ease-in-out infinite; }
  .l-wave i.p { background: var(--pink); }
  @keyframes lv { 0%,100% { transform: scaleY(.15); } 50% { transform: scaleY(1); } }
  .l-text { min-height: 52px; font-size: 18px; line-height: 1.45; text-align: center; padding: 0 12px; }
  .l-text .soft { color: var(--ink-3); }
  .l-bot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .l-bot .cancel { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 14px; }
  .l-bot .cancel:hover { background: #f1f1f1; }
  .l-bot .cancel svg { width: 14px; height: 14px; }
  .l-bot .done { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
  .l-bot .stop { width: 38px; height: 38px; border-radius: 50%; background: var(--pink-soft); display: flex; align-items: center; justify-content: center; }
  .l-bot .stop svg { width: 12px; height: 12px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bag-scene" viewBox="0 0 640 360">
      <rect width="640" height="360" fill="#e7b3a6"/>
      <path d="M0 40 L150 0 L210 0 L40 120 L0 120Z" fill="#dca293" opacity=".7"/>
      <path d="M90 0 L190 0 L120 70Z" fill="#d79a8b" opacity=".6"/>
      <rect y="268" width="640" height="92" fill="#d9a395"/>
      <path d="M170 92 H300 L312 300 H158Z" fill="#f4a5b9"/>
      <path d="M170 92 H300 L303 118 H167Z" fill="#ee90a9"/>
      <rect x="196" y="164" width="78" height="64" rx="4" fill="#f9d4de"/>
      <text x="235" y="190" text-anchor="middle" font-family="InterVariable, Inter, sans-serif" font-weight="600" font-size="19" fill="#161616">n8n</text>
      <text x="235" y="212" text-anchor="middle" font-family="InterVariable, Inter, sans-serif" font-weight="500" font-size="15" fill="#161616">Coffee</text>
      <ellipse cx="438" cy="290" rx="82" ry="12" fill="#c98f80" opacity=".6"/>
      <path d="M368 214 H508 L496 286 Q438 304 380 286Z" fill="#f6e7e2"/>
      <path d="M508 226 Q548 228 542 254 Q536 276 500 274" fill="none" stroke="#f6e7e2" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="438" cy="216" rx="70" ry="10" fill="#7a4b3a"/>
      <path d="M416 190 Q404 168 420 150 Q434 132 424 112" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
      <path d="M452 188 Q440 168 456 152 Q470 138 462 120" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
      <g fill="#6b3f2e"><ellipse cx="330" cy="318" rx="9" ry="6" transform="rotate(-20 330 318)"/><ellipse cx="350" cy="326" rx="9" ry="6" transform="rotate(15 350 326)"/><ellipse cx="318" cy="334" rx="9" ry="6" transform="rotate(30 318 334)"/><ellipse cx="372" cy="318" rx="9" ry="6" transform="rotate(-5 372 318)"/><ellipse cx="560" cy="318" rx="9" ry="6" transform="rotate(25 560 318)"/><ellipse cx="540" cy="330" rx="9" ry="6" transform="rotate(-15 540 330)"/></g>
    </symbol>
  </defs>
</svg>

<div class="app">
  <nav class="rail" aria-label="Primary">
    <button class="btn" title="New"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button class="btn" title="Search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="btn" title="Sidebar"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="sep"></div>
    <button class="btn on" title="Agents"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></button>
    <button class="btn" title="Home"><svg class="ico" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></button>
    <button class="btn" title="Workflows"><svg class="ico" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
    <div class="grow"></div>
    <button class="btn" title="Templates"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
    <button class="btn" title="Help"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
    <button class="btn" title="Settings"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </nav>

  <main class="stage">
    <div class="dots"></div>
    <div class="scroll" id="scroll">
      <div class="col">
        <div class="topline">
          <button class="ghost l"><svg class="ico" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></svg>All agents</button>
          <button class="ghost r" id="demo-btn">Play demo</button>
        </div>
        <header class="agent-head">
          <span class="glyph"><svg class="ico" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>
          <div><h1>Marketing agent</h1><p>Create campaign content from your ideas.</p></div>
        </header>
        <section id="thread"></section>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="idle">
          <div class="c-attach" id="c-attach"></div>
          <textarea class="c-text" id="c-text" rows="1" placeholder="Message Marketing agent"></textarea>
          <div class="row">
            <button class="ib" id="plus" title="Add"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
            <span class="sp"></span>
            <button class="ib" id="mic" title="Talk"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
            <button class="send off" id="send" title="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
          <div class="menu" id="menu">
            <button data-add="photo"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>Photo</button>
            <button data-add="video"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/></svg>Video</button>
          </div>
        </div>
        <div class="listen">
          <div class="l-top"><span class="t"><i></i>Listening…</span><span class="time" id="l-time">0:00</span></div>
          <div class="l-wave" id="l-wave"></div>
          <div class="l-text" id="l-text"></div>
          <div class="l-bot">
            <button class="cancel" id="l-cancel"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>Cancel</button>
            <span class="done">Done<button class="stop" id="l-done" title="Stop"><svg class="fill" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button></span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  function $(id) { return document.getElementById(id); }
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

  // ---------- icons
  var I = {
    play: '<svg class="fill" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
    x: '<svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    pencil: '<svg class="ico" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    chev: '<svg class="ico chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
    glyph: '<svg class="ico" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>'
  };
  var SCENE = '<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice"><use href="#bag-scene"/></svg>';

  function waveBars(n, pinkCount, seed) {
    var out = "", v = seed || 7;
    for (var i = 0; i < n; i++) {
      v = (v * 9301 + 49297) % 233280;
      var h = 5 + Math.round((v / 233280) * 17);
      out += '<i' + (i < pinkCount ? ' class="p"' : '') + ' style="height:' + h + 'px"></i>';
    }
    return out;
  }

  // ---------- state
  var S = { att: [], lastKind: null, listening: false, busy: false, suggested: null };

  // ---------- composer
  var ta = $("c-text");
  function updateSend() {
    var ok = S.att.length > 0 || ta.value.trim().length > 0;
    $("send").classList.toggle("off", !ok);
  }
  function autosize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; }
  ta.addEventListener("input", function () { autosize(); updateSend(); });
  ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

  function fmt(s) { return "0:" + (s < 10 ? "0" : "") + s; }
  function renderAttach() {
    var h = "";
    S.att.forEach(function (a, i) {
      if (a.t === "photo") h += '<div class="chip"><div class="thumb">' + SCENE + '</div>coffee-bag.jpg<button class="x" data-rm="' + i + '">' + I.x + '</button></div>';
      if (a.t === "video") h += '<div class="chip"><div class="thumb">' + SCENE + '<span class="vtag">' + I.play + '0:30</span></div>Coffee_launch.mp4<button class="x" data-rm="' + i + '">' + I.x + '</button></div>';
      if (a.t === "voice") h += '<div class="chip"><span class="vch"><span class="play">' + I.play + '</span><span class="wave">' + waveBars(14, 3, 11) + '</span>Voice brief · ' + fmt(a.dur) + '</span><button class="x" data-rm="' + i + '">' + I.x + '</button></div>';
    });
    $("c-attach").innerHTML = h;
    updateSend();
  }
  $("c-attach").addEventListener("click", function (e) {
    var b = e.target.closest("[data-rm]"); if (!b) return;
    var removed = S.att.splice(parseInt(b.getAttribute("data-rm"), 10), 1)[0];
    renderAttach();
    if (removed && removed.t !== "voice" && ta.value.trim() === S.suggested) setSuggested(null);
  });

  // attach menu
  function openMenu(open) { $("menu").classList.toggle("open", open); $("plus").classList.toggle("on", open); }
  $("plus").addEventListener("click", function (e) { e.stopPropagation(); openMenu(!$("menu").classList.contains("open")); });
  document.addEventListener("click", function () { openMenu(false); });
  $("menu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-add]"); if (!b) return;
    attach(b.getAttribute("data-add"));
  });
  var SUGGEST = {
    photo: "Create a short launch video for this coffee. Keep it warm and simple.",
    video: "Turn this video into a 20-second audio ad."
  };
  function setSuggested(kind) {
    // only replace the box if it is empty or still holds an earlier suggestion
    if (ta.value.trim() && ta.value.trim() !== S.suggested) return;
    S.suggested = kind ? SUGGEST[kind] : null;
    ta.value = kind ? SUGGEST[kind] : "";
    autosize(); updateSend();
    if (kind) {
      ta.classList.add("flash");
      setTimeout(function () { ta.classList.remove("flash"); }, 1100);
      ta.focus();
    }
  }
  function attach(kind) {
    S.att = S.att.filter(function (a) { return a.t === "voice"; });
    S.att.unshift({ t: kind });
    openMenu(false); renderAttach();
    setSuggested(kind);
  }

  // ---------- simulated voice
  function hasMedia(kind) { return S.att.some(function (a) { return a.t === kind; }); }
  function phrase() {
    if (S.lastKind === null) {
      if (hasMedia("video")) return { text: "Turn this video into a 20-second audio ad.", dur: 6 };
      return { text: "Create a short launch video for this coffee. Keep it warm and simple.", dur: 12 };
    }
    if (S.lastKind === "video1") return { text: "Make it a bit shorter and more upbeat.", dur: 5 };
    if (S.lastKind === "audio1") return { text: "A little slower, with a softer ending.", dur: 5 };
    return { text: "That works, thanks.", dur: 3 };
  }
  var L = { words: [], n: 0, tick: null, p: null };
  function startListen() {
    if (S.listening || S.busy) return;
    S.listening = true; openMenu(false);
    L.p = phrase(); L.words = L.p.text.split(" "); L.n = 0;
    var bars = "";
    for (var i = 0; i < 40; i++) bars += '<i class="' + (i % 7 === 3 ? "p" : "") + '" style="animation-delay:' + ((i * 83) % 700) + 'ms;animation-duration:' + (700 + (i * 53) % 500) + 'ms"></i>';
    $("l-wave").innerHTML = bars;
    $("l-text").innerHTML = ""; $("l-time").textContent = "0:00";
    $("composer").classList.add("is-listening");
    var total = L.words.length, ms = 3400 / total;
    L.tick = setInterval(function () {
      L.n++;
      var said = L.words.slice(0, L.n).join(" ");
      $("l-text").innerHTML = said + (L.n < total ? ' <span class="soft">…</span>' : "");
      $("l-time").textContent = fmt(Math.round(L.p.dur * L.n / total));
      if (L.n >= total) clearInterval(L.tick);
    }, ms);
  }
  function stopListen(keep) {
    if (!S.listening) return;
    clearInterval(L.tick);
    S.listening = false;
    $("composer").classList.remove("is-listening");
    if (keep) {
      S.att = S.att.filter(function (a) { return a.t !== "voice"; });
      S.att.push({ t: "voice", dur: L.p.dur });
      if (!ta.value.trim()) { ta.value = L.p.text; autosize(); }
      renderAttach();
    }
  }
  $("mic").addEventListener("click", startListen);
  $("l-cancel").addEventListener("click", function () { stopListen(false); });
  $("l-done").addEventListener("click", function () { stopListen(true); });

  // ---------- thread
  var thread = $("thread");
  function scrollDown() { var s = $("scroll"); s.scrollTo({ top: s.scrollHeight, behavior: "smooth" }); }
  function el(html, cls) { var d = document.createElement("div"); d.className = cls; d.innerHTML = html; thread.appendChild(d); return d; }

  function userBubble(att, text) {
    var a = "";
    att.forEach(function (x) {
      if (x.t === "photo") a += '<div class="thumb">' + SCENE + "</div>";
      if (x.t === "video") a += '<div class="thumb">' + SCENE + '<span class="vtag">' + I.play + '0:30</span></div>';
      if (x.t === "voice") a += '<div class="voice"><span class="play">' + I.play + '</span><span class="wave">' + waveBars(24, 5, 7) + '</span><span class="t">Voice brief · ' + fmt(x.dur) + "</span></div>";
    });
    var html = '<div class="bubble">' + (a ? '<div class="attach">' + a + "</div>" : "") + (text ? '<div class="text"></div>' : "") + "</div>";
    var d = el(html, "user enter");
    if (text) d.querySelector(".text").textContent = text;
    scrollDown();
  }

  // ---------- agent turns (all scripted)
  var TURNS = {
    video1: { steps: ["Looking at your photo", "Reading your brand voice", "Drafting the script", "Rendering the video"], worked: "5 s · 4 steps",
      card: { kind: "video", title: "Your launch video", dur: 18, head: "Meet your new morning ritual.", sub: "Smooth, balanced coffee for focused mornings." } },
    video2: { steps: ["Reading your change", "Trimming the video", "Adjusting the music"], worked: "3 s · 3 steps",
      card: { kind: "video", title: "Your launch video · Draft 2", note: "Shorter by 4 s · more upbeat music", dur: 14, head: "Meet your new morning ritual.", sub: "Smooth, balanced coffee for focused mornings." } },
    audio1: { steps: ["Watching your video", "Pulling out the key lines", "Writing a 20-second script", "Recording the voiceover"], worked: "5 s · 4 steps",
      card: { kind: "audio", title: "Your audio ad", note: "Adapted from Coffee_launch.mp4", dur: 20, script: "A fresh start, one cup at a time. Meet our smooth, balanced coffee, made for your morning ritual. Try it this week." } },
    audio2: { steps: ["Reading your change", "Slowing the pace", "Softening the ending"], worked: "3 s · 3 steps",
      card: { kind: "audio", title: "Your audio ad · Draft 2", note: "Slower pace · softer ending", dur: 22, script: "A fresh start, one cup at a time. Meet our smooth, balanced coffee, made for your morning ritual. Try it this week." } }
  };

  function cardHtml(c) {
    var note = c.note ? '<p class="note">' + c.note + "</p>" : "";
    if (c.kind === "video") {
      return '<div class="rhead"><h2>' + c.title + "</h2>" + note + "</div>" +
        '<div class="rbody"><div class="video" data-total="' + c.dur + '">' + SCENE + '<span class="pbtn">' + I.play + '</span><span class="len">' + fmt(c.dur) + '</span><span class="vbar"><i></i></span></div>' +
        '<div class="rside"><div class="copy"><div class="label">SUGGESTED COPY</div><div class="head">' + c.head + '</div><div class="sub">' + c.sub + "</div></div>" +
        '<div class="actions"><button class="b ghost2">' + I.pencil + 'Edit</button><button class="b primary">Use this version</button></div></div></div>';
    }
    return '<div class="rhead"><h2>' + c.title + "</h2>" + note + "</div>" +
      '<div class="audio" data-total="' + c.dur + '"><span class="play">' + I.play + '</span><span class="wave">' + waveBars(48, 0, 5) + '</span><span class="time">0:00 / ' + fmt(c.dur) + "</span></div>" +
      '<div class="script"><div class="label">SCRIPT</div><div class="txt">' + c.script + "</div></div>" +
      '<div class="actions"><button class="b ghost2">' + I.pencil + 'Edit script</button><button class="b primary">Use this version</button></div>';
  }

  // fake playback (progress only, no media)
  function wirePlayer(card) {
    var v = card.querySelector(".video, .audio"); if (!v) return;
    var total = parseInt(v.getAttribute("data-total"), 10), t = 0, timer = null;
    function paint() {
      if (v.classList.contains("video")) { v.querySelector(".vbar i").style.width = (t / total * 100) + "%"; v.querySelector(".len").textContent = fmt(Math.max(0, Math.ceil(total - t))); }
      else {
        var bars = v.querySelectorAll(".wave i"), k = Math.floor(bars.length * t / total);
        bars.forEach(function (b, i) { b.className = i < k ? "p" : ""; });
        v.querySelector(".time").textContent = fmt(Math.floor(t)) + " / " + fmt(total);
      }
    }
    function stop() { clearInterval(timer); timer = null; v.classList.remove("playing"); }
    v.addEventListener("click", function () {
      if (timer) { stop(); return; }
      v.classList.add("playing");
      timer = setInterval(function () { t += 0.1; if (t >= total) { t = 0; stop(); } paint(); }, 100);
    });
  }

  function agentTurn(key, fast) {
    var T = TURNS[key];
    var d = el('<span class="glyph">' + I.glyph + '</span><div class="body"><div class="trace open run"><button class="trace-head">' + I.chev +
      '<span class="head-dot"></span><span class="lbl">Working…</span></button><ul class="trace-list"></ul></div></div>', "agent enter");
    var trace = d.querySelector(".trace"), list = d.querySelector(".trace-list"), body = d.querySelector(".body");
    trace.querySelector(".trace-head").addEventListener("click", function () { trace.classList.toggle("open"); });

    function finish() {
      trace.classList.remove("run", "open");
      trace.querySelector(".lbl").textContent = "Worked for " + T.worked;
      var card = document.createElement("div"); card.className = "result enter"; card.innerHTML = cardHtml(T.card);
      body.appendChild(card); wirePlayer(card);
      S.lastKind = key; S.busy = false; scrollDown();
    }
    function addStep(txt, isDone) {
      var li = document.createElement("li"); li.className = isDone ? "done" : "run";
      li.innerHTML = '<span class="dot"></span><span>' + txt + "</span>"; list.appendChild(li);
    }
    S.busy = true;
    if (fast) { T.steps.forEach(function (s) { addStep(s, true); }); finish(); return; }
    var t = 500;
    T.steps.forEach(function (s) {
      later(function () { addStep(s, false); scrollDown(); }, t);
      t += 1050;
      later(function () { var li = list.children; for (var i = 0; i < li.length; i++) { li[i].classList.remove("run"); li[i].classList.add("done"); } }, t - 120);
    });
    later(finish, t + 250);
  }

  function replyFor() {
    if (S.lastKind === null) return hasMedia("video") ? "audio1" : "video1";
    if (S.lastKind === "video1") return "video2";
    if (S.lastKind === "audio1") return "audio2";
    return null;
  }

  function send() {
    if (S.busy || S.listening) return;
    var text = ta.value.trim();
    if (!S.att.length && !text) return;
    var key = replyFor();
    userBubble(S.att.slice(), text);
    S.att = []; ta.value = ""; autosize(); renderAttach();
    if (key) agentTurn(key, false);
    else {
      el('<span class="glyph">' + I.glyph + '</span><div class="body plain">That is as far as this demo goes for now.</div>', "agent enter");
      scrollDown();
    }
  }
  $("send").addEventListener("click", send);

  // ---------- demo + reset
  function resetAll() {
    timers.forEach(clearTimeout); timers = [];
    clearInterval(L.tick); S = { att: [], lastKind: null, listening: false, busy: false, suggested: null };
    $("composer").classList.remove("is-listening"); openMenu(false);
    thread.innerHTML = ""; ta.value = ""; autosize(); renderAttach();
  }

  function demo() {
    resetAll();
    var t = 900;
    later(function () { openMenu(true); }, t); t += 900;
    later(function () { attach("photo"); }, t); t += 900;
    later(startListen, t); t += 4400;
    later(function () { stopListen(true); }, t); t += 1100;
    later(send, t); t += 500 + 4 * 1050 + 250 + 1800;
    later(startListen, t); t += 4000;
    later(function () { stopListen(true); }, t); t += 1000;
    later(send, t);
  }

  function endState() {
    resetAll();
    userBubble([{ t: "photo" }, { t: "voice", dur: 12 }], "Create a short launch video for this coffee. Keep it warm and simple.");
    agentTurn("video1", true);
    userBubble([{ t: "voice", dur: 5 }], "Make it a bit shorter and more upbeat.");
    agentTurn("video2", true);
    $("scroll").scrollTop = $("scroll").scrollHeight;
  }

  $("demo-btn").addEventListener("click", demo);
  var q = location.search;
  if (q.indexOf("end") > -1) endState(); else if (q.indexOf("demo") > -1) demo();
</script>
</body>
</html>
